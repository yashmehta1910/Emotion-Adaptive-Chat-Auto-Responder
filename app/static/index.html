<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Responder</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <h1>Emotion Responder</h1>
      <p id="watching">Not watching a chat yet</p>
    </div>
    <div class="top-actions">
      <span id="status" class="status" data-state="stopped" role="status" aria-live="polite">
        <i class="dot" aria-hidden="true"></i><span id="status-text">Stopped</span>
      </span>
      <button id="toggle" class="btn primary" type="button">Start bot</button>
    </div>
  </header>

  <div id="notice" class="notice" role="alert" hidden></div>

  <section class="strip-zone" aria-label="Mood strip">
    <div id="strip" class="strip"></div>
    <p id="strip-caption" class="caption"></p>
  </section>

  <main class="grid">

    <!-- Settings -->
    <aside class="col controls" aria-label="Settings">
      <form id="settings-form" autocomplete="off">
        <fieldset class="modes">
          <legend>What should the bot do with replies?</legend>
          <label class="mode">
            <input type="radio" name="mode" value="dry">
            <span><strong>Practice</strong><small>Writes replies but sends nothing.</small></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="approve">
            <span><strong>Ask me first</strong><small>Each reply waits for your OK.</small></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="auto">
            <span><strong>Send automatically</strong><small>Replies go out on their own.</small></span>
          </label>
        </fieldset>

        <div class="field">
          <label for="driver">Where it runs</label>
          <select id="driver" name="driver">
            <option value="mock">Demo chat (built in)</option>
            <option value="whatsapp">WhatsApp Web</option>
          </select>
        </div>

        <div class="field">
          <label for="target">Chat to watch</label>
          <input id="target" name="target_chat" type="text" placeholder="Name exactly as WhatsApp shows it">
          <small>The bot only acts when this chat is open. Required to send on WhatsApp.</small>
        </div>

        <div class="field">
          <label for="style">How you text</label>
          <textarea id="style" name="style_notes" rows="3" placeholder="Short and friendly. I mix Hinglish and English."></textarea>
        </div>

        <details class="more">
          <summary>More options</summary>
          <div class="field inline">
            <label for="poll">Check every (seconds)</label>
            <input id="poll" name="poll_interval" type="number" min="1" max="60" step="1">
          </div>
          <div class="field inline">
            <label for="delay">Wait before sending (seconds)</label>
            <input id="delay" name="reply_delay" type="number" min="0" max="60" step="1">
          </div>
          <div class="field">
            <label for="nontext">Photos and voice notes</label>
            <select id="nontext" name="non_text_policy">
              <option value="skip">Skip them</option>
              <option value="ack">Reply with a fixed message</option>
            </select>
          </div>
          <div class="field">
            <label for="ack">Fixed message</label>
            <input id="ack" name="ack_text" type="text" placeholder="Got your photo, will look soon.">
          </div>
          <label class="check"><input type="checkbox" name="self_chat_test"> Treat my own messages as incoming (for testing in "Message yourself")</label>
          <label class="check"><input type="checkbox" name="reply_to_existing"> Also answer the message that is already there when the bot starts</label>
        </details>

        <div class="form-actions">
          <button class="btn" type="submit">Save settings</button>
          <span id="saved" class="saved" role="status" aria-live="polite"></span>
        </div>
      </form>
    </aside>

    <!-- Conversation -->
    <section class="col feed-col" aria-label="Conversation">
      <div id="pending-zone" class="pending-zone" hidden>
        <h2>Waiting for your OK</h2>
        <div id="pending"></div>
      </div>

      <div class="feed-head">
        <h2>Conversation</h2>
        <button id="clear" class="link-btn" type="button">Clear history</button>
      </div>
      <div id="feed" class="feed" tabindex="0"></div>
    </section>

    <!-- Summary + demo -->
    <aside class="col side" aria-label="Summary">
      <h2>Mood mix</h2>
      <ul id="mix" class="mix"></ul>
      <p id="summary" class="summary"></p>
      <p id="ai-label" class="ai-label"></p>

      <div id="demo" class="demo" hidden>
        <h2>Try it</h2>
        <p class="caption">You play the friend. The bot answers as you.</p>
        <div id="demo-log" class="demo-log" aria-live="polite"></div>
        <form id="demo-form" class="demo-form" autocomplete="off">
          <label class="sr-only" for="demo-text">Message as your friend</label>
          <input id="demo-text" type="text" placeholder="Type as your friend" maxlength="1000">
          <button class="btn" type="submit">Send</button>
        </form>
        <div class="demo-actions">
          <button id="demo-photo" class="link-btn" type="button">Send a photo</button>
          <button id="demo-reset" class="link-btn" type="button">Reset chat</button>
        </div>
      </div>
    </aside>

  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
